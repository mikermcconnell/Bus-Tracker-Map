<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bus cartoon options</title>
<style>*{box-sizing:border-box}body{margin:0;padding:42px;background:#eef3f5;color:#082f49;font-family:Arial,sans-serif}h1{margin:0 0 8px;font-size:34px}p{margin:0 0 30px;color:#617681;font-size:18px}.grid{display:grid;grid-template-columns:repeat(2,minmax(360px,1fr));gap:25px;max-width:1050px}.card{min-height:355px;background:#fff;border:1px solid #d7e2e8;border-radius:22px;box-shadow:0 8px 24px #27465816;padding:22px;display:flex;flex-direction:column;align-items:center;justify-content:center}.card img{width:280px;height:255px;object-fit:contain}.wide img{width:330px}h2{margin:10px 0 2px;font-size:21px}.note{color:#687e89;font-size:14px}</style></head>
<body><h1>Bus cartoon directions</h1><p>Four fresh character and viewing-angle options</p><div class="grid">
<div class="card"><img src="option-1-friendly-front.svg" alt="Friendly front-view bus"><h2>1. Friendly front</h2><div class="note">Clean and recognizable</div></div>
<div class="card wide"><img src="option-2-side-profile.svg" alt="Side-profile bus"><h2>2. Side profile</h2><div class="note">Classic transit illustration</div></div>
<div class="card"><img src="option-3-three-quarter.svg" alt="Three-quarter bus"><h2>3. Three-quarter</h2><div class="note">More movement and dimension</div></div>
<div class="card"><img src="option-4-mini-mascot.svg" alt="Mini mascot bus"><h2>4. Mini mascot</h2><div class="note">Most playful and memorable</div></div>
</div></body></html>
