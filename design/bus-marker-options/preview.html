<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Bus marker options</title>
  <style>
    *{box-sizing:border-box} body{margin:0;padding:46px;background:#eef3f5;color:#082f49;font-family:Arial,sans-serif}
    h1{margin:0 0 8px;font-size:34px} p{margin:0 0 32px;color:#506673;font-size:18px}
    .grid{display:grid;grid-template-columns:repeat(2,minmax(300px,1fr));gap:28px;max-width:1000px}
    article{min-height:330px;padding:25px;background:#fff;border:1px solid #d7e2e8;border-radius:20px;box-shadow:0 8px 24px #27465817;display:flex;flex-direction:column;align-items:center;justify-content:center}
    img{width:220px;height:220px;object-fit:contain} h2{margin:15px 0 4px;font-size:21px}.note{margin:0;text-align:center;font-size:14px;color:#687e89}
  </style>
</head>
<body>
  <h1>Barrie Transit bus marker options</h1>
  <p>Sample route: 8A</p>
  <div class="grid">
    <article><img src="option-1-classic-pin.svg" alt="Classic pin"><h2>1. Classic pin</h2><div class="note">Most familiar map-marker shape</div></article>
    <article><img src="option-2-roundel.svg" alt="Roundel"><h2>2. Roundel</h2><div class="note">Strongest visibility at small sizes</div></article>
    <article><img src="option-3-directional.svg" alt="Directional marker"><h2>3. Directional</h2><div class="note">Naturally communicates bus heading</div></article>
    <article><img src="option-4-platform-card.svg" alt="Platform card"><h2>4. Platform card</h2><div class="note">Best match for terminal signage</div></article>
  </div>
</body>
</html>
