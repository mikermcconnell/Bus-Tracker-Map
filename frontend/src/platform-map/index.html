<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Barrie Allandale Terminal Live Platform Map</title>
  <meta name="viewport" content="width=device-width,height=device-height,initial-scale=1,viewport-fit=cover">
  <link rel="stylesheet" href="%APP_CSS%">
  <meta name="app-build-id" content="%BUILD_ID%">
</head>
<body>
  <main class="platform-app">
    <div id="platform-canvas" class="platform-canvas">
      <header class="platform-header">
        <div class="platform-header__identity">
          <span class="platform-header__eyebrow">Live terminal display</span>
          <h1>Barrie Allandale Terminal</h1>
        </div>
        <div id="connection-status" class="connection-status status-connecting" role="status" aria-live="polite">
          <span class="connection-status__dot"></span>
          <span id="connection-label">CONNECTING</span>
        </div>
        <div class="platform-header__time">
          <time id="platform-clock">--:--</time>
          <span id="last-updated">WAITING FOR LIVE DATA</span>
        </div>
      </header>

      <section class="terminal-status-rail" aria-label="Terminal live status">
        <section id="source-statuses" class="source-statuses" aria-label="Transit feed status"></section>
        <div id="platform-status" class="platform-status" role="alert" aria-live="assertive" hidden></div>
        <div id="terminal-empty" class="terminal-empty" role="status" hidden>No live vehicles in the terminal area</div>
      </section>

      <div class="platform-workspace">
        <div class="map-stage">
          <div class="map-plane">
            <object
              data="./assets/allandale-basemap.svg"
              type="image/svg+xml"
              aria-label="Barrie Allandale Transit Terminal platform layout"
              class="map-image"
              id="map-image"
            >Barrie Allandale Transit Terminal platform layout</object>
            <div
              id="platform-basemap"
              class="platform-basemap"
              aria-label="Mapbox map of Barrie Allandale Transit Terminal"
            ></div>
            <section id="map-platform-layer" class="map-platform-layer" aria-label="Platform locations and scheduled routes"></section>
            <div id="bus-layer" class="bus-layer" aria-label="Live vehicles"></div>
          </div>
          <section id="map-label-layer" class="map-label-layer" aria-label="Platform labels">
            <div id="map-label-rail-top" class="map-label-rail map-label-rail--top"></div>
            <div id="map-label-rail-bottom" class="map-label-rail map-label-rail--bottom"></div>
            <div id="map-label-rail-right" class="map-label-rail map-label-rail--right"></div>
          </section>
        </div>
        <aside class="platform-directory" aria-labelledby="platform-directory-title">
          <header class="platform-directory__header">
            <div class="platform-directory__heading">
              <h2 id="platform-directory-title">Departures By Platform</h2>
              <p id="departure-page-label">P1–P6</p>
            </div>
            <div class="departure-page-indicator" aria-label="Departure page 1 of 2">
              <span class="departure-page-indicator__dot" data-page="0" aria-hidden="true"></span>
              <span class="departure-page-indicator__dot" data-page="1" aria-hidden="true"></span>
              <span class="departure-page-indicator__timing">
                <strong id="departure-page-count">1 / 2</strong>
                <span id="departure-page-countdown">Next page in 15s</span>
              </span>
            </div>
          </header>
          <section id="assignment-layer" class="assignment-layer" aria-label="Scheduled platform assignments"></section>
        </aside>
      </div>

      <footer class="platform-footer">
        <div id="display-legend" class="display-legend">
          <strong>Scheduled platform service</strong>
          <span><i class="display-legend__vehicle"></i>Live vehicles appear as coloured icons</span>
        </div>
        <div id="service-notice" class="service-notice" role="status" aria-live="polite" hidden>
          <strong>Service update</strong>
          <span id="service-notice-text"></span>
        </div>
      </footer>
    </div>
  </main>
  <script src="%APP_JS%"></script>
</body>
</html>
