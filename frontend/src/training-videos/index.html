<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Barrie Transit Travel Tips</title>
  <meta name="viewport" content="width=device-width,height=device-height,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <meta name="theme-color" content="#071b2f">
  <meta name="app-build-id" content="%BUILD_ID%">
  <link rel="stylesheet" href="%APP_CSS%">
</head>
<body>
  <main class="training-screen">
    <div class="training-content">
      <section class="training-stage" aria-label="Barrie Transit travel tip video">
        <div class="training-player-wrap">
          <div id="training-player"></div>
          <div id="training-holding" class="training-holding" role="status">
            <h1 id="training-holding-title">Loading travel tips</h1>
            <p id="training-holding-message">Please wait while the video loads.</p>
            <button id="training-start" class="training-start" type="button" hidden>Start videos</button>
          </div>
        </div>
      </section>

      <aside class="training-playlist" aria-label="Travel tip video playlist">
        <header class="training-playlist-header">
          <div class="training-playlist-heading">
            <span class="training-playlist-eyebrow">Now showing</span>
            <h2>Travel tips</h2>
            <p id="training-playlist-count">Loading videos</p>
          </div>
          <div class="training-playlist-clock" role="timer" aria-label="Time until next video" aria-live="off">
            <strong id="training-countdown-value">--</strong>
            <span id="training-countdown-label">SEC LEFT</span>
          </div>
        </header>
        <div class="training-playlist-body">
          <section aria-labelledby="training-now-heading">
            <h3 id="training-now-heading">Playing now</h3>
            <ol id="training-now-list" class="training-video-list"></ol>
          </section>
          <section aria-labelledby="training-up-next-heading">
            <h3 id="training-up-next-heading">Up next</h3>
            <ol id="training-up-next-list" class="training-video-list"></ol>
            <p id="training-up-next-more" class="training-up-next-more" hidden></p>
          </section>
        </div>
      </aside>
    </div>

    <section class="training-captions" aria-label="Large video captions">
      <p id="training-caption" class="training-caption">Captions will appear when the video begins.</p>
    </section>

    <footer class="training-footer">
      <span id="training-title">How to Wait for and Board a Bus</span>
    </footer>
  </main>
  <script src="%APP_JS%"></script>
</body>
</html>
