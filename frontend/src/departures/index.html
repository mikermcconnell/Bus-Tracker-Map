<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#071b32">
  <title>Allandale Departures</title>
  <link rel="stylesheet" href="%APP_CSS%">
</head>
<body>
  <svg class="logo-filters" aria-hidden="true">
    <filter id="northland-solid-yellow" color-interpolation-filters="sRGB">
      <feFlood flood-color="#febd11" result="solid-color"></feFlood>
      <feComposite in="solid-color" in2="SourceAlpha" operator="in"></feComposite>
    </filter>
  </svg>
  <main class="board" aria-labelledby="page-title">
    <header class="masthead">
      <h1 id="page-title">Departures</h1>
      <time id="clock-time" aria-live="off">--:--</time>
    </header>

    <div id="warning" class="warning" role="status" hidden>Updates are temporarily unavailable. Showing the most recently received departures.</div>

    <section class="departures-panel" aria-label="Upcoming departures">
      <ol id="departures-list" class="departures-list">
        <li class="empty-state">Loading departures…</li>
      </ol>
    </section>
    <p id="service-health" class="visually-hidden" aria-live="polite"></p>
    <p id="last-updated" class="visually-hidden">Connecting…</p>
  </main>
  <script src="%APP_JS%" defer></script>
</body>
</html>
